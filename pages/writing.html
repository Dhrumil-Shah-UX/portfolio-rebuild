<section class="page" id="writing" data-page-view="writing">
        <section class="writing-page" aria-labelledby="writing-title">
          <section class="writing-hero" id="design-notes-viewer">
            <div class="writing-hero-scenery" aria-hidden="true">
              <div class="leaf-shadow-layer leaf-shadow-left"></div>
              <div class="leaf-shadow-layer leaf-shadow-right"></div>
            </div>

            <div class="writing-hero-copy">
              <p class="section-kicker">Writing</p>
              <h1 id="writing-title">Design Notes</h1>
              <p class="writing-lede">I notice little things in everyday life that make me wonder, &ldquo;Couldn't this work better?&rdquo;</p>
              <span class="writing-rule" aria-hidden="true"></span>
              <p class="writing-sublede">15 little observations from everyday life</p>
            </div>

            <div class="notebook-stage" aria-live="polite">
              <div class="notebook-wrap">
                <div class="notebook" data-note-book></div>
              </div>
              <div class="notebook-controls" aria-label="Design notes controls">
                <button class="notebook-arrow icon-button-only" type="button" data-note-prev aria-label="Previous design note"><span class="ui-icon ui-icon--chevron-left" aria-hidden="true"></span></button>
                <span class="notebook-line" aria-hidden="true"></span>
                <span class="notebook-indicator" data-note-indicator>1 / 1</span>
                <span class="notebook-line" aria-hidden="true"></span>
                <button class="notebook-arrow icon-button-only" type="button" data-note-next aria-label="Next design note"><span class="ui-icon ui-icon--chevron-right" aria-hidden="true"></span></button>
              </div>
            </div>
          </section>

          <section class="writing-section articles-section" aria-labelledby="articles-title">
            <div class="writing-section-heading">
              <div>
                <h2 id="articles-title">Articles</h2>
                <p>Sometimes a thought needs more than a quick note. Here's where I dig deeper into design, AI, and accessibility.</p>
              </div>
            </div>
            <div class="article-card-grid" data-article-list></div>
          </section>
        </section>
      </section>
